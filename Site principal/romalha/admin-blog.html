<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Novo Artigo | Legalizzare</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --preto:   #0d0d0d;
            --branco:  #fafafa;
            --verm:    #8b1a1a;
            --verm-lt: #a82020;
            --cinza:   #f2f2f2;
            --borda:   #d8d8d8;
            --texto:   #2a2a2a;
            --muted:   #888;
            --radius:  6px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--cinza);
            color: var(--texto);
            min-height: 100vh;
        }

        /* ── TOPO ── */
        header {
            background: var(--preto);
            padding: 18px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header img {
            height: 36px;
            width: auto;
        }

        header span {
            font-family: 'Playfair Display', serif;
            color: var(--verm);
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ── CONTAINER ── */
        .wrapper {
            max-width: 820px;
            margin: 48px auto;
            padding: 0 20px 80px;
        }

        .page-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            font-weight: 700;
            color: var(--preto);
            margin-bottom: 6px;
        }

        .page-sub {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 36px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--borda);
        }

        /* ── CARD ── */
        .card {
            background: #fff;
            border-radius: var(--radius);
            border: 1px solid var(--borda);
            padding: 36px 40px;
            margin-bottom: 24px;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 15px;
            font-weight: 600;
            color: var(--verm);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--borda);
        }

        /* ── CAMPOS ── */
        .field {
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--preto);
            margin-bottom: 8px;
        }

        label .opt {
            font-weight: 400;
            color: var(--muted);
            text-transform: none;
            letter-spacing: 0;
        }

        input[type="text"],
        textarea {
            width: 100%;
            border: 1px solid var(--borda);
            border-radius: var(--radius);
            padding: 12px 16px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--texto);
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--verm);
            box-shadow: 0 0 0 3px rgba(139,26,26,0.08);
        }

        textarea {
            resize: vertical;
            line-height: 1.7;
        }

        textarea.corpo {
            min-height: 280px;
        }

        /* ── BLOCKQUOTE FIELD ── */
        .quote-wrap {
            display: flex;
            gap: 0;
        }

        .quote-bar {
            width: 4px;
            background: var(--verm);
            border-radius: 4px 0 0 4px;
            flex-shrink: 0;
        }

        .quote-wrap textarea {
            border-left: none;
            border-radius: 0 var(--radius) var(--radius) 0;
            font-style: italic;
            font-size: 15px;
            color: #444;
            min-height: 100px;
        }

        .quote-wrap textarea:focus {
            border-color: var(--verm);
            box-shadow: 0 0 0 3px rgba(139,26,26,0.08);
        }

        /* ── UPLOAD ── */
        .upload-area {
            border: 2px dashed var(--borda);
            border-radius: var(--radius);
            padding: 28px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            position: relative;
        }

        .upload-area:hover {
            border-color: var(--verm);
            background: rgba(139,26,26,0.03);
        }

        .upload-area input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        .upload-icon {
            font-size: 32px;
            margin-bottom: 10px;
            color: var(--muted);
        }

        .upload-label {
            font-size: 13px;
            color: var(--muted);
        }

        .upload-label strong {
            color: var(--verm);
        }

        #preview-img {
            display: none;
            max-width: 100%;
            max-height: 220px;
            border-radius: var(--radius);
            margin-top: 16px;
            object-fit: cover;
        }

        /* ── BOTÃO ── */
        .btn-publish {
            width: 100%;
            background: var(--verm);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            padding: 16px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-publish:hover  { background: var(--verm-lt); }
        .btn-publish:active { transform: scale(0.99); }

        .btn-cancel {
            display: block;
            text-align: center;
            margin-top: 14px;
            font-size: 13px;
            color: var(--muted);
            text-decoration: none;
        }

        .btn-cancel:hover { color: var(--verm); }
    </style>
</head>
<body>

    <header>
        <img src="logo_legalizzare.png" alt="Legalizzare"
             onerror="this.outerHTML='<span style=\'font-family:Playfair Display,serif;color:#fff;font-size:20px;\'>Legalizzare</span>'">
        <span>Painel Admin</span>
    </header>

    <div class="wrapper">

        <h1 class="page-title">Novo Artigo</h1>
        <p class="page-sub">Preencha os campos abaixo e clique em Publicar para salvar o artigo no site.</p>

        <form action="salvar_artigo.php" method="POST" enctype="multipart/form-data">

            <!-- IDENTIFICAÇÃO -->
            <div class="card">
                <div class="card-title">Identificação</div>

                <div class="field">
                    <label for="titulo">Título</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Ex.: Escritura Pública: o que é e por que importa" required>
                </div>

                <div class="field">
                    <label for="subtitulo">Subtítulo <span class="opt">(opcional)</span></label>
                    <input type="text" id="subtitulo" name="subtitulo" placeholder="Uma linha complementar ao título">
                </div>
            </div>

            <!-- IMAGEM -->
            <div class="card">
                <div class="card-title">Foto de Destaque</div>

                <div class="field">
                    <div class="upload-area" id="upload-area">
                        <input type="file" name="imagem" id="imagem" accept="image/*" onchange="previewFoto(this)">
                        <div class="upload-icon">🖼</div>
                        <p class="upload-label"><strong>Clique para escolher</strong> ou arraste a imagem aqui</p>
                        <p class="upload-label" style="margin-top:4px; font-size:11px;">JPG, PNG ou WEBP · máx. 5 MB</p>
                    </div>
                    <img id="preview-img" alt="Pré-visualização">
                </div>

                <div class="field">
                    <label for="legenda_foto">Legenda da Foto <span class="opt">(opcional)</span></label>
                    <input type="text" id="legenda_foto" name="legenda_foto" placeholder="Ex.: Cartório de Registro de Imóveis — Três Rios/RJ">
                </div>
            </div>

            <!-- CONTEÚDO -->
            <div class="card">
                <div class="card-title">Conteúdo</div>

                <div class="field">
                    <label for="texto_destaque">Frase de Destaque <span class="opt">(citação — opcional)</span></label>
                    <div class="quote-wrap">
                        <div class="quote-bar"></div>
                        <textarea id="texto_destaque" name="texto_destaque" rows="3"
                            placeholder="Uma frase marcante que resume o artigo…"></textarea>
                    </div>
                </div>

                <div class="field">
                    <label for="conteudo">Corpo do Artigo</label>
                    <textarea id="conteudo" name="conteudo" class="corpo"
                        placeholder="Escreva o texto completo do artigo aqui…" required></textarea>
                </div>
            </div>

            <!-- AÇÕES -->
            <button type="submit" class="btn-publish">Publicar Artigo</button>
            <a href="index_romalha.html" class="btn-cancel">Cancelar e voltar ao site</a>

        </form>
    </div>

    <script>
        function previewFoto(input) {
            const img = document.getElementById('preview-img');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = e => {
                    img.src = e.target.result;
                    img.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>

</body>
</html>
